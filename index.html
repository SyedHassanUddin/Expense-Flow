<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quantiv - Smart Financial Tracking</title>
    <meta name="description" content="Track your finances with smart voice input, receipt scanning, bank integration, and beautiful analytics">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- ⚠️ DO NOT REMOVE THIS! Custom Chatbot Embed -->
    <script src="https://cdn.botpress.cloud/webchat/v3.1/inject.js" defer></script>
    <script src="https://files.bpcontent.cloud/2025/07/09/20/20250709201348-R0LYMAL3.js" defer></script>
    
   <script>
      window.addEventListener('message', function(event) {
      if (event.data && event.data.name === 'webchat-ready') {
      // Wait a moment to ensure the iframe loads into the DOM
      setTimeout(() => {
        const chatBubble = document.querySelector('iframe[src*="webchat.botpress.cloud"]')?.parentElement;
        if (chatBubble) {
          chatBubble.style.position = 'fixed';
          chatBubble.style.bottom = '100px'; // Move up from bottom
          chatBubble.style.right = '30px';   // Optional tweak
          chatBubble.style.zIndex = '9999';  // Ensure it's on top
        }
      }, 500); // 500ms delay to ensure iframe is ready
    }
  });
</script>



  </body>
</html>
